[workspace]
resolver = "2"
members = [
    "crates/proof-of-observation",
    "crates/reputation-accumulator",
    "crates/relay",
    "crates/psi",
    "crates/ceremony",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ciprian-LocalPulse/umbra-exchange"

[workspace.dependencies]
ark-ff = "0.4"
ark-ec = "0.4"
ark-std = "0.4"
ark-relations = "0.4"
ark-r1cs-std = "0.4"
ark-crypto-primitives = { version = "0.4", features = ["r1cs", "merkle_tree", "crh"] }
ark-groth16 = "0.4"
ark-bn254 = "0.4"
ark-snark = "0.6"
ark-serialize = "0.4"
light-poseidon = "0.2.0"
rand = "0.8"

# relay crate
axum = "0.7"
tokio = "1"
serde = "1"
serde_json = "1"
hex = "0.4"
tower = "0.5"

# psi crate — deliberately NOT arkworks/BN254: DH-PSI needs a proper,
# already-implemented hash-to-group primitive, and neither ark-bn254 nor
# ark-ec ship one for BN254's G1 (checked: ark-ec's hashing module only
# has SWU/Wahby-Boneh maps, which need isogeny parameters nobody has
# derived for this curve; deriving them here would be exactly the kind of
# unreviewed cryptographic parameter generation this project's own
# SECURITY.md warns against). curve25519-dalek's Ristretto group ships a
# safe, standard, widely-audited hash-to-group construction
# (RistrettoPoint::hash_from_bytes) instead — see psi crate's module docs.
curve25519-dalek = "4"
sha2 = "0.10"

# ceremony crate — Phase 2 MPC, ported from celo-org/snark-setup
rand_chacha = "0.3"
blake2 = "0.10"

# Pinned as a direct dependency (even though not used directly by our code)
# to constrain the resolver: newer zeroize releases require the
# `edition2024` Cargo feature, which isn't stabilized in the Rust/Cargo
# version available in this environment (1.75).
zeroize = "=1.7.0"
zeroize_derive = "=1.4.3"
rayon-core = "=1.12.1"
rayon = "=1.10.0"
