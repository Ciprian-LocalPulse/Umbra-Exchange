[package]
name = "proof-of-observation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Groth16 circuit: prove Merkle-inclusion of an indicator in an epoch commitment, gated by an anonymous tier credential, with nullifier-based replay protection."

[features]
test-support = []

[dependencies]
ark-ff = { workspace = true }
ark-ec = { workspace = true }
ark-std = { workspace = true }
ark-relations = { workspace = true }
ark-r1cs-std = { workspace = true }
ark-crypto-primitives = { workspace = true }
ark-groth16 = { workspace = true }
ark-bn254 = { workspace = true }
ark-snark = { workspace = true }
ark-serialize = { workspace = true }
light-poseidon = { workspace = true }
# Only actually used by the fingerprint/verify-ceremony-params binaries
# (both gated behind required-features = ["test-support"]) — kept as a
# normal, not dev, dependency because binaries can't link dev-dependencies.
rand = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
zeroize = { workspace = true }
zeroize_derive = { workspace = true }
rayon-core = { workspace = true }
rayon = { workspace = true }

[[bin]]
name = "fingerprint"
required-features = ["test-support"]

[[bin]]
name = "verify-ceremony-params"
path = "src/bin/verify_ceremony_params.rs"
required-features = ["test-support"]
