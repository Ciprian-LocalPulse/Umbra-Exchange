name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (rustc ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 1.75 is the documented floor (docs/BUILD_NOTES.md); stable
        # catches anything that only breaks on newer toolchains.
        rust: ["1.75.0", "stable"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: circuits

      - name: cargo test -p reputation-accumulator
        working-directory: circuits
        run: cargo test -p reputation-accumulator --verbose

      - name: cargo test -p proof-of-observation
        working-directory: circuits
        run: cargo test -p proof-of-observation --features test-support --verbose

      - name: cargo test -p ceremony
        working-directory: circuits
        run: cargo test -p ceremony --features test-support --verbose

      - name: cargo test --workspace
        working-directory: circuits
        run: cargo test --workspace --features test-support --verbose

      - name: build ceremony tooling (test-support-gated binaries)
        working-directory: circuits
        run: |
          cargo build -p proof-of-observation --features test-support --bins --verbose
          cargo build -p ceremony --features test-support --bins --verbose

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: circuits

      - name: cargo fmt --check
        working-directory: circuits
        run: cargo fmt --all -- --check

      - name: cargo clippy (default features)
        working-directory: circuits
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo clippy (all features — covers ceremony tooling binaries)
        working-directory: circuits
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

